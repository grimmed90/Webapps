<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verktyg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="res/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="res/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="res/favicon-16x16.png">
    <link rel="manifest" href="res/site.webmanifest">
    <script src="shiftConfig.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Anpassad stil för att ge fokus en mjukare övergång */
        input:focus {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 space-y-6">
        
        <!-- Main Menu -->
        <div id="main-menu" class="space-y-6">
             <header class="text-center">
                <h1 class="text-3xl font-bold text-gray-800">Verktyg</h1>
                <p class="text-gray-500 mt-1">Välj ett verktyg nedan.</p>
            </header>
            <div class="space-y-4">
                <button id="btn-omlaggning" class="w-full py-3 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">Omläggning</button>
                <button id="btn-skiftschema" class="w-full py-3 px-4 bg-green-600 text-white rounded-md hover:bg-green-700 transition">Skiftschema</button>
            </div>
        </div>

        <!-- Omläggning View -->
        <div id="omlaggning-view" class="hidden space-y-6">
             <header class="text-center">
                <h1 class="text-3xl font-bold text-gray-800">Omläggning</h1>
                <p class="text-gray-500 mt-1">Beräkna tid tills nästa omläggning.</p>
            </header>

             <!-- Inmatningsformulär -->
            <div class="space-y-4">
                <div>
                    <label for="start-time" class="block text-sm font-medium text-gray-700">Starttid (senaste tambourskifte)</label>
                    <input type="time" id="start-time" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="tonnage" class="block text-sm font-medium text-gray-700">Ton kvar</label>
                    <input type="number" id="tonnage" inputmode="decimal" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="t.ex. 100" required>
                </div>
                <div>
                    <label for="speed" class="block text-sm font-medium text-gray-700">Hastighet (ton/timme)</label>
                    <input type="number" id="speed" inputmode="decimal" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="t.ex. 20" required>
                </div>
            </div>

            <!-- Knapp -->
            <div>
                <button id="calculate-button" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform active:scale-95">
                    Beräkna
                </button>
            </div>

            <!-- Resultatvisning -->
            <div id="result-container" class="text-center pt-4 hidden">
                 <p class="text-gray-600">Beräknad sluttid:</p>
                 <p id="result-text" class="text-2xl font-bold text-blue-700"></p>
                 <p id="result-date" class="text-lg font-medium text-gray-500"></p>
            </div>

            <!-- Felmeddelande -->
            <div id="error-container" class="text-center pt-4 hidden">
                 <p id="error-text" class="text-md font-medium text-red-600"></p>
            </div>

            <button id="back-to-menu-oml" class="w-full mt-4 py-2 text-sm text-gray-600 hover:text-gray-900">Tillbaka till menyn</button>
        </div>

        <!-- Skiftschema View -->
        <div id="skiftschema-view" class="hidden space-y-6">
            <header class="text-center">
                <h1 class="text-3xl font-bold text-gray-800">Skiftschema</h1>
                <p class="text-gray-500 mt-1">Stora Enso Fors (5-skift)</p>
            </header>

            <div class="space-y-4">
                <div>
                    <select id="team-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md font-medium text-gray-700 shadow-sm">
                        <option value="Alla lag">Alla lag</option>
                        <option value="A-lag">A-lag</option>
                        <option value="B-lag">B-lag</option>
                        <option value="C-lag">C-lag</option>
                        <option value="D-lag">D-lag</option>
                        <option value="E-lag">E-lag</option>
                    </select>
                </div>

                <!-- My Team Container -->
                <div id="my-team-container" class="hidden space-y-6">
                    <!-- Today Badge -->
                    <div id="my-team-today" class="text-center p-6 rounded-xl border">
                        <!-- Content injected via JS -->
                    </div>

                    <!-- Monthly Calendar Grid -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-3">Schema Månad</h3>
                        <div id="my-team-calendar" class="grid grid-cols-7 gap-1 text-center text-xs">
                            <!-- JS will inject days and shifts here -->
                        </div>
                    </div>

                    <!-- Upcoming Shifts List -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-3">Kommande Skift (14 dagar)</h3>
                        <ul id="my-team-agenda" class="space-y-2">
                             <!-- Content injected via JS -->
                        </ul>
                    </div>
                </div>

                <!-- All Teams Matrix Container -->
                <div id="all-teams-container" class="hidden space-y-4 overflow-hidden">
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded-md border">
                        <label for="matrix-date" class="text-sm font-medium text-gray-700">Startdatum:</label>
                        <input type="date" id="matrix-date" class="block pl-3 pr-3 py-1 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md shadow-sm">
                    </div>

                    <div class="overflow-x-auto rounded-lg border border-gray-200">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-3 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Datum</th>
                                    <th scope="col" class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider">A</th>
                                    <th scope="col" class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider">B</th>
                                    <th scope="col" class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider">C</th>
                                    <th scope="col" class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider">D</th>
                                    <th scope="col" class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider">E</th>
                                </tr>
                            </thead>
                            <tbody id="matrix-table-body" class="bg-white divide-y divide-gray-200">
                                <!-- Content injected via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <button id="back-to-menu-skiftschema" class="w-full mt-4 py-2 text-sm text-gray-600 hover:text-gray-900">Tillbaka till menyn</button>
        </div>

    </div>

    <script>
        // --- Navigation Logic ---
        const mainMenu = document.getElementById('main-menu');
        const omlaggningView = document.getElementById('omlaggning-view');
        const skiftschemaView = document.getElementById('skiftschema-view');

        document.getElementById('btn-omlaggning').addEventListener('click', () => {
            mainMenu.classList.add('hidden');
            omlaggningView.classList.remove('hidden');
        });

        document.getElementById('btn-skiftschema').addEventListener('click', () => {
            mainMenu.classList.add('hidden');
            skiftschemaView.classList.remove('hidden');
        });

        document.getElementById('back-to-menu-oml').addEventListener('click', () => {
            omlaggningView.classList.add('hidden');
            mainMenu.classList.remove('hidden');
        });

        document.getElementById('back-to-menu-skiftschema').addEventListener('click', () => {
            skiftschemaView.classList.add('hidden');
            mainMenu.classList.remove('hidden');
        });

        // --- Omläggning Logic ---
        // Hämta DOM-element
        const startTimeInput = document.getElementById('start-time');
        const tonnageInput = document.getElementById('tonnage');
        const speedInput = document.getElementById('speed');
        const calculateButton = document.getElementById('calculate-button');
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const resultDate = document.getElementById('result-date');
        const errorContainer = document.getElementById('error-container');
        const errorText = document.getElementById('error-text');

        /**
         * Visar ett felmeddelande och döljer resultatet.
         * @param {string} message - Meddelandet som ska visas.
         */
        function showError(message) {
            errorText.textContent = message;
            errorContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');
        }

        /**
         * Döljer felmeddelandet.
         */
        function hideError() {
            errorContainer.classList.add('hidden');
        }

        /**
         * Beräknar och visar sluttiden.
         */
        function calculateEndTime() {
            hideError();

            // Hämta och validera värden
            const startTimeValue = startTimeInput.value;
            if (!startTimeValue) {
                showError("Du måste ange en starttid.");
                return;
            }

            const totalTonnage = parseFloat(tonnageInput.value);
            if (isNaN(totalTonnage) || totalTonnage < 0) {
                showError("Total ton måste vara ett positivt tal.");
                return;
            }

            const speedTonPerHour = parseFloat(speedInput.value);
            if (isNaN(speedTonPerHour) || speedTonPerHour <= 0) {
                showError("Hastigheten måste vara större än noll.");
                return;
            }

            // --- Beräkningslogik ---

            // 1. Skapa ett datumobjekt för starttiden. Den antar alltid att startdatumet är idag.
            const now = new Date();
            const [startHours, startMinutes] = startTimeValue.split(':').map(Number);
            let startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), startHours, startMinutes);

            // 2. Beräkna den totala tiden i millisekunder
            const hoursDuration = totalTonnage / speedTonPerHour;
            const msDuration = hoursDuration * 3600 * 1000;

            // 3. Beräkna sluttiden genom att addera den totala tiden till starttiden
            const endTime = new Date(startTime.getTime() + msDuration);

            // 4. Formatera och visa resultatet
            const optionsTime = { hour: '2-digit', minute: '2-digit' };
            const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            
            // Använder svensk locale för korrekt formatering
            const formattedTime = endTime.toLocaleTimeString('sv-SE', optionsTime);
            const formattedDate = endTime.toLocaleDateString('sv-SE', optionsDate);

            resultText.textContent = formattedTime;
            resultDate.textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1); // Gör första bokstaven i veckodagen stor
            resultContainer.classList.remove('hidden');
        }

        // Sätt en lyssnare på knappen
        calculateButton.addEventListener('click', calculateEndTime);
        
        // Lägg till lyssnare för att kunna beräkna med Enter-tangenten
        [startTimeInput, tonnageInput, speedInput].forEach(input => {
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    calculateEndTime();
                }
            });
        });

        // --- Skiftschema Logic ---
        const teamSelect = document.getElementById('team-select');
        const myTeamContainer = document.getElementById('my-team-container');
        const allTeamsContainer = document.getElementById('all-teams-container');
        const matrixDateInput = document.getElementById('matrix-date');

        const MS_PER_DAY = 1000 * 60 * 60 * 24;

        function getShift(targetDate, teamOffset) {
            if (!window.shiftConfig) return 'L';
            const anchorDate = new Date(window.shiftConfig.anchorDate);

            // Convert both dates to UTC midnight to avoid timezone offset issues
            const utcTarget = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            const utcAnchor = Date.UTC(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate());

            // Calculate absolute difference in days
            const diffDays = Math.floor((utcTarget - utcAnchor) / MS_PER_DAY);

            const cycleLength = window.shiftConfig.pattern.length;
            // Mathematical modulo to handle negative days if necessary
            let shiftIndex = ((diffDays - teamOffset) % cycleLength + cycleLength) % cycleLength;
            return window.shiftConfig.pattern[shiftIndex];
        }

        function getShiftTypeInfo(shiftCode) {
             return window.shiftConfig.shiftTypes[shiftCode] || window.shiftConfig.shiftTypes['L'];
        }

        let shiftCountdownInterval;

        function updateMyTeamCountdown(shiftCode, shiftInfo) {
            const countdownEl = document.getElementById('my-team-countdown');
            if (!countdownEl) return;

            if (shiftCode === 'L') {
                 countdownEl.textContent = "Du är ledig!";
                 return;
            }

            const timeParts = shiftInfo.time.split(' - ');
            if (timeParts.length !== 2) return;

            const [startHour, startMinute] = timeParts[0].split(':').map(Number);
            const [endHour, endMinute] = timeParts[1].split(':').map(Number);

            const now = new Date();
            let endTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), endHour, endMinute);
            let startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), startHour, startMinute);

            // Handle cross-midnight shifts (e.g. 22:00 - 06:00)
            if (endHour < startHour) {
                if (now.getHours() >= startHour) {
                    // It's before midnight, shift ends tomorrow
                    endTime.setDate(endTime.getDate() + 1);
                } else {
                    // It's after midnight, shift started yesterday
                    startTime.setDate(startTime.getDate() - 1);
                }
            }

            if (now < startTime) {
                 const diff = startTime - now;
                 const hours = Math.floor(diff / (1000 * 60 * 60));
                 const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                 countdownEl.textContent = `Börjar om: ${hours}h ${minutes}m`;
            } else if (now >= startTime && now <= endTime) {
                 const diff = endTime - now;
                 const hours = Math.floor(diff / (1000 * 60 * 60));
                 const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                 countdownEl.textContent = `Tid kvar: ${hours}h ${minutes}m`;
            } else {
                 countdownEl.textContent = "Skiftet slut för idag!";
            }
        }

        function renderMyTeamView(teamName) {
            const teamOffset = window.shiftConfig.teamOffsets[teamName];
            const today = new Date();

            // 1. Render Today
            const todayShiftCode = getShift(today, teamOffset);
            const todayShiftInfo = getShiftTypeInfo(todayShiftCode);
            const todayContainer = document.getElementById('my-team-today');
            todayContainer.className = `text-center p-6 rounded-xl border ${todayShiftInfo.colorClass} flex flex-col justify-between`;

            todayContainer.innerHTML = `
                <div>
                    <p class="text-sm font-semibold uppercase tracking-wider mb-1 opacity-80">Ditt skift idag</p>
                    <p class="text-4xl font-bold mb-2">${todayShiftInfo.name}</p>
                    <p class="text-sm opacity-90 mb-4">${todayShiftInfo.time}</p>
                </div>
                <div class="bg-white bg-opacity-30 rounded p-2 inline-block self-center min-w-[200px]">
                    <p id="my-team-countdown" class="text-lg font-mono font-bold tracking-tight"></p>
                </div>
            `;

            // Clear any existing interval
            if (shiftCountdownInterval) clearInterval(shiftCountdownInterval);

            // Update immediately, then every minute
            updateMyTeamCountdown(todayShiftCode, todayShiftInfo);
            if (todayShiftCode !== 'L') {
                shiftCountdownInterval = setInterval(() => {
                    updateMyTeamCountdown(todayShiftCode, todayShiftInfo);
                }, 60000);
            }

            // 2. Render Agenda (Next 14 Days)
            today.setHours(0,0,0,0);
            const agendaContainer = document.getElementById('my-team-agenda');
            agendaContainer.innerHTML = '';
            for (let i = 1; i <= 14; i++) {
                const futureDate = new Date(today);
                futureDate.setDate(today.getDate() + i);
                const shiftCode = getShift(futureDate, teamOffset);
                const shiftInfo = getShiftTypeInfo(shiftCode);

                const dateStr = futureDate.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' });

                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3 rounded-lg border ${shiftInfo.colorClass}`;
                li.innerHTML = `
                    <span class="font-medium capitalize w-24">${dateStr}</span>
                    <span class="font-bold flex-1 text-center">${shiftInfo.name}</span>
                    <span class="text-xs opacity-75 w-20 text-right">${shiftCode !== 'L' ? shiftInfo.time.split(' - ')[0] : ''}</span>
                `;
                agendaContainer.appendChild(li);
            }

            // 3. Render Monthly Calendar
            const calendarContainer = document.getElementById('my-team-calendar');
            calendarContainer.innerHTML = '';

            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay(); // 0 is Sunday

            // Adjust so Monday is first column
            const startEmptyCells = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1;

            // Header for weekdays
            const weekdays = ['Må', 'Ti', 'On', 'To', 'Fr', 'Lö', 'Sö'];
            weekdays.forEach(day => {
                const headerCell = document.createElement('div');
                headerCell.className = 'font-semibold text-gray-500 py-1';
                headerCell.textContent = day;
                calendarContainer.appendChild(headerCell);
            });

            // Empty cells
            for (let i = 0; i < startEmptyCells; i++) {
                const emptyCell = document.createElement('div');
                calendarContainer.appendChild(emptyCell);
            }

            // Days
            for (let i = 1; i <= daysInMonth; i++) {
                const cellDate = new Date(currentYear, currentMonth, i);
                const shiftCode = getShift(cellDate, teamOffset);
                const shiftInfo = getShiftTypeInfo(shiftCode);

                const isToday = i === today.getDate();

                const cell = document.createElement('div');
                cell.className = `p-2 rounded flex flex-col items-center justify-center ${shiftInfo.colorClass} ${isToday ? 'ring-2 ring-black font-bold' : ''}`;
                cell.innerHTML = `
                    <span class="text-xs opacity-75">${i}</span>
                    <span class="font-semibold">${shiftCode}</span>
                `;
                calendarContainer.appendChild(cell);
            }
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
            return weekNo;
        }

        function renderMatrixView(startDate) {
            const tableBody = document.getElementById('matrix-table-body');
            tableBody.innerHTML = '';

            const teams = ['A-lag', 'B-lag', 'C-lag', 'D-lag', 'E-lag'];

            let currentWeek = -1;

            for (let i = 0; i < 14; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);

                const tr = document.createElement('tr');

                // Add week separator if week changes
                const weekNum = getWeekNumber(date);
                if (weekNum !== currentWeek && i !== 0 && date.getDay() === 1) { // Monday
                    const separator = document.createElement('tr');
                    separator.className = 'bg-gray-100';
                    separator.innerHTML = `<td colspan="6" class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase">Vecka ${weekNum}</td>`;
                    tableBody.appendChild(separator);
                    currentWeek = weekNum;
                } else if (i === 0) {
                     currentWeek = weekNum;
                     const separator = document.createElement('tr');
                     separator.className = 'bg-gray-100';
                     separator.innerHTML = `<td colspan="6" class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase">Vecka ${weekNum}</td>`;
                     tableBody.appendChild(separator);
                }

                const dateStr = date.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'numeric' });

                let rowHtml = `<td class="px-3 py-2 whitespace-nowrap text-sm font-medium text-gray-900 capitalize">${dateStr}</td>`;

                teams.forEach(team => {
                    const offset = window.shiftConfig.teamOffsets[team];
                    const shiftCode = getShift(date, offset);
                    const shiftInfo = getShiftTypeInfo(shiftCode);
                    rowHtml += `<td class="px-2 py-2 whitespace-nowrap text-sm text-center font-bold ${shiftInfo.colorClass}">${shiftCode}</td>`;
                });

                tr.innerHTML = rowHtml;
                tableBody.appendChild(tr);
            }
        }

        function updateSkiftschemaView() {
            const selected = teamSelect.value;
            localStorage.setItem('selectedTeam', selected);

            if (selected === 'Alla lag') {
                myTeamContainer.classList.add('hidden');
                allTeamsContainer.classList.remove('hidden');

                let matrixDate = new Date();
                if (matrixDateInput.value) {
                    matrixDate = new Date(matrixDateInput.value);
                } else {
                    matrixDateInput.valueAsDate = new Date();
                }
                renderMatrixView(matrixDate);
            } else {
                allTeamsContainer.classList.add('hidden');
                myTeamContainer.classList.remove('hidden');
                renderMyTeamView(selected);
            }
        }

        // Initialize Skiftschema
        const savedTeam = localStorage.getItem('selectedTeam');
        if (savedTeam) {
            teamSelect.value = savedTeam;
        } else {
            // Default to Alla lag if nothing is saved
            teamSelect.value = 'Alla lag';
        }

        teamSelect.addEventListener('change', updateSkiftschemaView);
        matrixDateInput.addEventListener('change', () => {
             if(teamSelect.value === 'Alla lag') renderMatrixView(new Date(matrixDateInput.value));
        });

        // Add event listener to update view when tab is opened
        document.getElementById('btn-skiftschema').addEventListener('click', updateSkiftschemaView);

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
