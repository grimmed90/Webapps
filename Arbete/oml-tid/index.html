<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verktyg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="res/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="res/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="res/favicon-16x16.png"
    />
    <link rel="manifest" href="res/site.webmanifest" />
    <script src="shiftConfig.js"></script>
    <!-- Tesseract.js för OCR-skanning direkt i webbläsaren -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      /* Anpassad stil för att ge fokus en mjukare övergång */
      input:focus {
        transition: all 0.2s ease-in-out;
      }
      .font-mono-num {
        font-family: "JetBrains Mono", monospace;
      }
      /* Mjuk dimning utanför siktramen för att hjälpa operatören att sikta rätt */
      .viewfinder-mask {
        box-shadow: 0 0 0 9999px rgba(255, 255, 255, 0.85);
      }

      @keyframes scan-glow {
        0% {
          top: 4%;
          opacity: 0.2;
        }
        50% {
          top: 92%;
          opacity: 0.9;
        }
        100% {
          top: 4%;
          opacity: 0.2;
        }
      }
      .scanner-line {
        animation: scan-glow 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 flex items-center justify-center min-h-screen antialiased"
  >
    <!-- Notification Banner (Körprogram) -->
    <div
      id="toast-banner"
      class="fixed top-16 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2"
    >
      <div
        id="toast-content"
        class="px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium border bg-slate-900 border-slate-700 text-white"
      >
        <i id="toast-icon" data-lucide="info" class="w-5 h-5 text-cyan-400"></i>
        <span id="toast-msg">Meddelande</span>
      </div>
    </div>

    <div
      id="legacy-views"
      class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 space-y-6"
    >
      <!-- Main Menu -->
      <div id="main-menu" class="space-y-6">
        <header class="text-center">
          <h1 class="text-3xl font-bold text-gray-800">Verktyg</h1>
          <p class="text-gray-500 mt-1">Välj ett verktyg nedan.</p>
        </header>
        <div class="space-y-4">
          <button
            id="btn-omlaggning"
            class="w-full py-3 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition"
          >
            Omläggning
          </button>
          <button
            id="btn-skiftschema"
            class="w-full py-3 px-4 bg-green-600 text-white rounded-md hover:bg-green-700 transition"
          >
            Skiftschema
          </button>
        </div>
        <div class="mt-8 space-y-4">
          <button
            id="btn-korprogram"
            class="w-full py-3 px-4 bg-cyan-600 text-white rounded-md hover:bg-cyan-700 transition"
          >
            Körprogram Meterräknare
          </button>
        </div>
      </div>

      <!-- Omläggning View -->
      <div id="omlaggning-view" class="hidden space-y-6">
        <header class="text-center">
          <h1 class="text-3xl font-bold text-gray-800">Omläggning</h1>
          <p class="text-gray-500 mt-1">Beräkna tid tills nästa omläggning.</p>
        </header>

        <!-- Inmatningsformulär -->
        <div class="space-y-4">
          <div>
            <label
              for="start-time"
              class="block text-sm font-medium text-gray-700"
              >Starttid (senaste tambourskifte)</label
            >
            <input
              type="time"
              id="start-time"
              class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              required
            />
          </div>
          <div>
            <label for="tonnage" class="block text-sm font-medium text-gray-700"
              >Ton kvar</label
            >
            <input
              type="number"
              id="tonnage"
              inputmode="decimal"
              class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              placeholder="t.ex. 100"
              required
            />
          </div>
          <div>
            <label for="speed" class="block text-sm font-medium text-gray-700"
              >Hastighet (ton/timme)</label
            >
            <input
              type="number"
              id="speed"
              inputmode="decimal"
              class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              placeholder="t.ex. 20"
              required
            />
          </div>
        </div>

        <!-- Knapp -->
        <div>
          <button
            id="calculate-button"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform active:scale-95"
          >
            Beräkna
          </button>
        </div>

        <!-- Resultatvisning -->
        <div id="result-container" class="text-center pt-4 hidden">
          <p class="text-gray-600">Beräknad sluttid:</p>
          <p id="result-text" class="text-2xl font-bold text-blue-700"></p>
          <p id="result-date" class="text-lg font-medium text-gray-500"></p>
        </div>

        <!-- Felmeddelande -->
        <div id="error-container" class="text-center pt-4 hidden">
          <p id="error-text" class="text-md font-medium text-red-600"></p>
        </div>

        <button
          id="back-to-menu-oml"
          class="w-full mt-4 py-2 text-sm text-gray-600 hover:text-gray-900"
        >
          Tillbaka till menyn
        </button>
      </div>

      <!-- Skiftschema View -->
      <div id="skiftschema-view" class="hidden space-y-6">
        <header class="text-center">
          <h1 class="text-3xl font-bold text-gray-800">Skiftschema</h1>
          <p class="text-gray-500 mt-1">Stora Enso Fors (5-skift)</p>
        </header>

        <div class="space-y-4">
          <div>
            <select
              id="team-select"
              class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md font-medium text-gray-700 shadow-sm"
            >
              <option value="Alla lag">Alla lag</option>
              <option value="A-lag">A-lag</option>
              <option value="B-lag">B-lag</option>
              <option value="C-lag">C-lag</option>
              <option value="D-lag">D-lag</option>
              <option value="E-lag">E-lag</option>
            </select>
          </div>

          <!-- My Team Container -->
          <div id="my-team-container" class="hidden space-y-6">
            <!-- Today Badge -->
            <div id="my-team-today" class="text-center p-6 rounded-xl border">
              <!-- Content injected via JS -->
            </div>

            <!-- Monthly Calendar Grid -->
            <div>
              <div class="flex items-center justify-between mb-3 bg-gray-50 p-2 rounded-md border">
                <button
                  id="team-prev-month"
                  class="p-1 rounded-md text-gray-500 hover:bg-gray-200 hover:text-gray-700 focus:outline-none"
                >
                  <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <h3
                  id="team-calendar-month-label"
                  class="text-sm font-semibold text-gray-700 uppercase tracking-wider"
                >
                  Schema Månad
                </h3>
                <button
                  id="team-next-month"
                  class="p-1 rounded-md text-gray-500 hover:bg-gray-200 hover:text-gray-700 focus:outline-none"
                >
                  <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
              </div>
              <div
                id="my-team-calendar"
                class="grid grid-cols-7 gap-1 text-center text-xs"
              >
                <!-- JS will inject days and shifts here -->
              </div>
            </div>

            <!-- Upcoming Shifts List -->
            <div>
              <h3
                class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-3"
              >
                Kommande Skift (14 dagar)
              </h3>
              <ul id="my-team-agenda" class="space-y-2">
                <!-- Content injected via JS -->
              </ul>
            </div>
          </div>

          <!-- All Teams Matrix Container -->
          <div
            id="all-teams-container"
            class="hidden space-y-4 overflow-hidden"
          >
            <div
              class="flex justify-between items-center bg-gray-50 p-2 rounded-md border"
            >
              <button
                id="matrix-prev-month"
                class="p-1 rounded-md text-gray-500 hover:bg-gray-200 hover:text-gray-700 focus:outline-none"
              >
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
              </button>

              <div class="flex items-center gap-2">
                <label for="matrix-month" class="text-sm font-medium text-gray-700"
                  >Månad:</label
                >
                <input
                  type="month"
                  id="matrix-month"
                  class="block pl-3 pr-3 py-1 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md shadow-sm"
                />
              </div>

              <button
                id="matrix-next-month"
                class="p-1 rounded-md text-gray-500 hover:bg-gray-200 hover:text-gray-700 focus:outline-none"
              >
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="overflow-x-auto rounded-lg border border-gray-200">
              <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-gray-50">
                  <tr>
                    <th
                      scope="col"
                      class="px-3 py-3 text-left font-medium text-gray-500 uppercase tracking-wider"
                    >
                      Datum
                    </th>
                    <th
                      scope="col"
                      class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider"
                    >
                      A
                    </th>
                    <th
                      scope="col"
                      class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider"
                    >
                      B
                    </th>
                    <th
                      scope="col"
                      class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider"
                    >
                      C
                    </th>
                    <th
                      scope="col"
                      class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider"
                    >
                      D
                    </th>
                    <th
                      scope="col"
                      class="px-2 py-3 text-center font-medium text-gray-500 uppercase tracking-wider"
                    >
                      E
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="matrix-table-body"
                  class="bg-white divide-y divide-gray-200"
                >
                  <!-- Content injected via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <button
          id="back-to-menu-skiftschema"
          class="w-full mt-4 py-2 text-sm text-gray-600 hover:text-gray-900"
        >
          Tillbaka till menyn
        </button>
      </div>
    </div>

    <script>
      // --- Navigation Logic ---
      const mainMenu = document.getElementById("main-menu");
      const omlaggningView = document.getElementById("omlaggning-view");
      const skiftschemaView = document.getElementById("skiftschema-view");

      document
        .getElementById("btn-omlaggning")
        .addEventListener("click", () => {
          mainMenu.classList.add("hidden");
          omlaggningView.classList.remove("hidden");
        });

      document
        .getElementById("btn-skiftschema")
        .addEventListener("click", () => {
          mainMenu.classList.add("hidden");
          skiftschemaView.classList.remove("hidden");
        });

      document
        .getElementById("back-to-menu-oml")
        .addEventListener("click", () => {
          omlaggningView.classList.add("hidden");
          mainMenu.classList.remove("hidden");
        });

      document
        .getElementById("back-to-menu-skiftschema")
        .addEventListener("click", () => {
          skiftschemaView.classList.add("hidden");
          mainMenu.classList.remove("hidden");
        });

      const legacyViews = document.getElementById("legacy-views");

      document
        .getElementById("btn-korprogram")
        .addEventListener("click", () => {
          window.location.href = "meterraknare.html";
        });

      // --- Omläggning Logic ---
      // Hämta DOM-element
      const startTimeInput = document.getElementById("start-time");
      const tonnageInput = document.getElementById("tonnage");
      const speedInput = document.getElementById("speed");
      const calculateButton = document.getElementById("calculate-button");
      const resultContainer = document.getElementById("result-container");
      const resultText = document.getElementById("result-text");
      const resultDate = document.getElementById("result-date");
      const errorContainer = document.getElementById("error-container");
      const errorText = document.getElementById("error-text");

      /**
       * Visar ett felmeddelande och döljer resultatet.
       * @param {string} message - Meddelandet som ska visas.
       */
      function showError(message) {
        errorText.textContent = message;
        errorContainer.classList.remove("hidden");
        resultContainer.classList.add("hidden");
      }

      /**
       * Döljer felmeddelandet.
       */
      function hideError() {
        errorContainer.classList.add("hidden");
      }

      /**
       * Beräknar och visar sluttiden.
       */
      function calculateEndTime() {
        hideError();

        // Hämta och validera värden
        const startTimeValue = startTimeInput.value;
        if (!startTimeValue) {
          showError("Du måste ange en starttid.");
          return;
        }

        const totalTonnage = parseFloat(tonnageInput.value);
        if (isNaN(totalTonnage) || totalTonnage < 0) {
          showError("Total ton måste vara ett positivt tal.");
          return;
        }

        const speedTonPerHour = parseFloat(speedInput.value);
        if (isNaN(speedTonPerHour) || speedTonPerHour <= 0) {
          showError("Hastigheten måste vara större än noll.");
          return;
        }

        // --- Beräkningslogik ---

        // 1. Skapa ett datumobjekt för starttiden. Den antar alltid att startdatumet är idag.
        const now = new Date();
        const [startHours, startMinutes] = startTimeValue
          .split(":")
          .map(Number);
        let startTime = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
          startHours,
          startMinutes,
        );

        // 2. Beräkna den totala tiden i millisekunder
        const hoursDuration = totalTonnage / speedTonPerHour;
        const msDuration = hoursDuration * 3600 * 1000;

        // 3. Beräkna sluttiden genom att addera den totala tiden till starttiden
        const endTime = new Date(startTime.getTime() + msDuration);

        // 4. Formatera och visa resultatet
        const optionsTime = { hour: "2-digit", minute: "2-digit" };
        const optionsDate = {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        };

        // Använder svensk locale för korrekt formatering
        const formattedTime = endTime.toLocaleTimeString("sv-SE", optionsTime);
        const formattedDate = endTime.toLocaleDateString("sv-SE", optionsDate);

        resultText.textContent = formattedTime;
        resultDate.textContent =
          formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1); // Gör första bokstaven i veckodagen stor
        resultContainer.classList.remove("hidden");
      }

      // Sätt en lyssnare på knappen
      calculateButton.addEventListener("click", calculateEndTime);

      // Lägg till lyssnare för att kunna beräkna med Enter-tangenten
      [startTimeInput, tonnageInput, speedInput].forEach((input) => {
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            calculateEndTime();
          }
        });
      });

      // --- Skiftschema Logic ---
      const teamSelect = document.getElementById("team-select");
      const myTeamContainer = document.getElementById("my-team-container");
      const allTeamsContainer = document.getElementById("all-teams-container");
      const matrixMonthInput = document.getElementById("matrix-month");

      let currentTeamMonth = new Date(); // To track the currently viewed month for a specific team
      currentTeamMonth.setDate(1); // Ensure date is 1 to avoid end of month wrapping issues

      const MS_PER_DAY = 1000 * 60 * 60 * 24;

      function getShift(targetDate, teamOffset) {
        if (!window.shiftConfig) return "L";
        const anchorDate = new Date(window.shiftConfig.anchorDate);

        // Convert both dates to UTC midnight to avoid timezone offset issues
        const utcTarget = Date.UTC(
          targetDate.getFullYear(),
          targetDate.getMonth(),
          targetDate.getDate(),
        );
        const utcAnchor = Date.UTC(
          anchorDate.getFullYear(),
          anchorDate.getMonth(),
          anchorDate.getDate(),
        );

        // Calculate absolute difference in days
        const diffDays = Math.floor((utcTarget - utcAnchor) / MS_PER_DAY);

        const cycleLength = window.shiftConfig.pattern.length;
        // Mathematical modulo to handle negative days if necessary
        let shiftIndex =
          (((diffDays - teamOffset) % cycleLength) + cycleLength) % cycleLength;
        return window.shiftConfig.pattern[shiftIndex];
      }

      function getShiftTypeInfo(shiftCode) {
        return (
          window.shiftConfig.shiftTypes[shiftCode] ||
          window.shiftConfig.shiftTypes["L"]
        );
      }

      let shiftCountdownInterval;

      function updateMyTeamCountdown(shiftCode, shiftInfo) {
        const countdownEl = document.getElementById("my-team-countdown");
        if (!countdownEl) return;

        if (shiftCode === "L") {
          countdownEl.textContent = "Du är ledig!";
          return;
        }

        const timeParts = shiftInfo.time.split(" - ");
        if (timeParts.length !== 2) return;

        const [startHour, startMinute] = timeParts[0].split(":").map(Number);
        const [endHour, endMinute] = timeParts[1].split(":").map(Number);

        const now = new Date();
        let endTime = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
          endHour,
          endMinute,
        );
        let startTime = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
          startHour,
          startMinute,
        );

        // Handle cross-midnight shifts (e.g. 22:00 - 06:00)
        if (endHour < startHour) {
          if (now.getHours() >= startHour) {
            // It's before midnight, shift ends tomorrow
            endTime.setDate(endTime.getDate() + 1);
          } else {
            // It's after midnight, shift started yesterday
            startTime.setDate(startTime.getDate() - 1);
          }
        }

        if (now < startTime) {
          const diff = startTime - now;
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          countdownEl.textContent = `Börjar om: ${hours}h ${minutes}m`;
        } else if (now >= startTime && now <= endTime) {
          const diff = endTime - now;
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          countdownEl.textContent = `Tid kvar: ${hours}h ${minutes}m`;
        } else {
          countdownEl.textContent = "Skiftet slut för idag!";
        }
      }

      function renderMyTeamView(teamName) {
        const teamOffset = window.shiftConfig.teamOffsets[teamName];
        const today = new Date();

        // 1. Render Today
        const todayShiftCode = getShift(today, teamOffset);
        const todayShiftInfo = getShiftTypeInfo(todayShiftCode);
        const todayContainer = document.getElementById("my-team-today");
        todayContainer.className = `text-center p-6 rounded-xl border ${todayShiftInfo.colorClass} flex flex-col justify-between`;

        todayContainer.innerHTML = `
                <div>
                    <p class="text-sm font-semibold uppercase tracking-wider mb-1 opacity-80">Ditt skift idag</p>
                    <p class="text-4xl font-bold mb-2">${todayShiftInfo.name}</p>
                    <p class="text-sm opacity-90 mb-4">${todayShiftInfo.time}</p>
                </div>
                <div class="bg-white bg-opacity-30 rounded p-2 inline-block self-center min-w-[200px]">
                    <p id="my-team-countdown" class="text-lg font-mono font-bold tracking-tight"></p>
                </div>
            `;

        // Clear any existing interval
        if (shiftCountdownInterval) clearInterval(shiftCountdownInterval);

        // Update immediately, then every minute
        updateMyTeamCountdown(todayShiftCode, todayShiftInfo);
        if (todayShiftCode !== "L") {
          shiftCountdownInterval = setInterval(() => {
            updateMyTeamCountdown(todayShiftCode, todayShiftInfo);
          }, 60000);
        }

        // 2. Render Agenda (Next 14 Days)
        today.setHours(0, 0, 0, 0);
        const agendaContainer = document.getElementById("my-team-agenda");
        agendaContainer.innerHTML = "";
        for (let i = 1; i <= 14; i++) {
          const futureDate = new Date(today);
          futureDate.setDate(today.getDate() + i);
          const shiftCode = getShift(futureDate, teamOffset);
          const shiftInfo = getShiftTypeInfo(shiftCode);

          const dateStr = futureDate.toLocaleDateString("sv-SE", {
            weekday: "short",
            day: "numeric",
            month: "short",
          });

          const li = document.createElement("li");
          li.className = `flex justify-between items-center p-3 rounded-lg border ${shiftInfo.colorClass}`;
          li.innerHTML = `
                    <span class="font-medium capitalize w-24">${dateStr}</span>
                    <span class="font-bold flex-1 text-center">${shiftInfo.name}</span>
                    <span class="text-xs opacity-75 w-20 text-right">${shiftCode !== "L" ? shiftInfo.time.split(" - ")[0] : ""}</span>
                `;
          agendaContainer.appendChild(li);
        }

        // 3. Render Monthly Calendar
        renderTeamCalendar(teamName, currentTeamMonth.getFullYear(), currentTeamMonth.getMonth());
      }

      function renderTeamCalendar(teamName, year, month) {
        const teamOffset = window.shiftConfig.teamOffsets[teamName];
        const calendarContainer = document.getElementById("my-team-calendar");
        const monthLabel = document.getElementById("team-calendar-month-label");
        calendarContainer.innerHTML = "";

        const monthDate = new Date(year, month, 1);
        const monthName = monthDate.toLocaleDateString("sv-SE", { month: "long" });
        monthLabel.textContent = `${monthName} ${year}`;

        const today = new Date();
        const currentYear = year;
        const currentMonth = month;
        const daysInMonth = new Date(
          currentYear,
          currentMonth + 1,
          0,
        ).getDate();
        const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay(); // 0 is Sunday

        // Adjust so Monday is first column
        const startEmptyCells = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1;

        // Header for weekdays
        const weekdays = ["Må", "Ti", "On", "To", "Fr", "Lö", "Sö"];
        weekdays.forEach((day) => {
          const headerCell = document.createElement("div");
          headerCell.className = "font-semibold text-gray-500 py-1";
          headerCell.textContent = day;
          calendarContainer.appendChild(headerCell);
        });

        // Empty cells

      function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        var weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        return weekNo;
      }

      function renderMatrixView(year, month) {
        const tableBody = document.getElementById("matrix-table-body");
        tableBody.innerHTML = "";

        const teams = ["A-lag", "B-lag", "C-lag", "D-lag", "E-lag"];

        let currentWeek = -1;

        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
          const date = new Date(year, month, i);

          const tr = document.createElement("tr");

          // Add week separator if week changes
          const weekNum = getWeekNumber(date);
          if (weekNum !== currentWeek && i !== 1 && date.getDay() === 1) {
            // Monday
            const separator = document.createElement("tr");
            separator.className = "bg-gray-100";
            separator.innerHTML = `<td colspan="6" class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase">Vecka ${weekNum}</td>`;
            tableBody.appendChild(separator);
            currentWeek = weekNum;
          } else if (i === 1) {
            currentWeek = weekNum;
            const separator = document.createElement("tr");
            separator.className = "bg-gray-100";
            separator.innerHTML = `<td colspan="6" class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase">Vecka ${weekNum}</td>`;
            tableBody.appendChild(separator);
          }

          const dateStr = date.toLocaleDateString("sv-SE", {
            weekday: "short",
            day: "numeric",
            month: "numeric",
          });

          let rowHtml = `<td class="px-3 py-2 whitespace-nowrap text-sm font-medium text-gray-900 capitalize">${dateStr}</td>`;

          teams.forEach((team) => {
            const offset = window.shiftConfig.teamOffsets[team];
            const shiftCode = getShift(date, offset);
            const shiftInfo = getShiftTypeInfo(shiftCode);
            rowHtml += `<td class="px-2 py-2 whitespace-nowrap text-sm text-center font-bold ${shiftInfo.colorClass}">${shiftCode}</td>`;
          });

          tr.innerHTML = rowHtml;
          tableBody.appendChild(tr);
        }
      }

      // Initiera Web Audio för bekräftelsesignal
      function initAudio() {
        if (!state.audioCtx) {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) state.audioCtx = new AudioClass();
        }
      }

      function triggerSuccessSignal() {
        if (state.soundEnabled) {
          try {
            initAudio();
            if (state.audioCtx) {
              if (state.audioCtx.state === "suspended") state.audioCtx.resume();
              const ctx = state.audioCtx;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();

              osc.type = "sine";
              osc.frequency.setValueAtTime(980, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(
                1320,
                ctx.currentTime + 0.08,
              );

              gain.gain.setValueAtTime(0.01, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.02);
              gain.gain.exponentialRampToValueAtTime(
                0.001,
                ctx.currentTime + 0.12,
              );

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime);
              osc.stop(ctx.currentTime + 0.13);
            }
          } catch (_) {}
        }

        if ("vibrate" in navigator) {
          try {
            navigator.vibrate([35, 25, 55]);
          } catch (_) {}
        }
      }

      function showToast(msg) {

        }, 2000);
      }

      async function initOcrWorker() {
        if (state.ocrWorker) return;
        ocrStatusBadge.textContent = "Startar motor...";
        try {
          const worker = await Tesseract.createWorker("eng");
          // PSM 7 = Single text line.
          // Strikt whitelist '0123456789' ser till att inga bokstäver eller skiljetecken feltolkas.
          await worker.setParameters({
            tessedit_char_whitelist: "0123456789",
            tessedit_pageseg_mode: "7",
          });
          state.ocrWorker = worker;
          ocrStatusBadge.textContent = "OCR Redo";
        } catch (err) {
          console.error("OCR initialization failed:", err);
          ocrStatusBadge.textContent = "OCR-fel";
        }
      }

      // Beskär och förbehandlar sökramen så att tabellinjer klipps bort och siffror framhävs
      function prepareCroppedFrame() {
        const vidW = videoFeed.videoWidth;
        const vidH = videoFeed.videoHeight;
        if (!vidW || !vidH) return null;

        // Hämta centrum av videon (motsvarande sökramen)
        const rawW = Math.floor(vidW * 0.4);
        const rawH = Math.floor(vidH * 0.17);
        const rawX = Math.floor((vidW - rawW) / 2);
        const rawY = Math.floor((vidH - rawH) / 2);

        // Klipp in 14% på sidorna för att slippa datorskärmens svarta vertikala tabellinjer '|'
        const insetX = Math.floor(rawW * 0.14);
        const insetY = Math.floor(rawH * 0.12);
        const targetW = rawW - insetX * 2;
        const targetH = rawH - insetY * 2;
        const targetX = rawX + insetX;
        const targetY = rawY + insetY;

        // Skala upp 2.5x för att reducera moiré och ge skarpa kanter
        const scale = 2.5;
        cropCanvas.width = Math.floor(targetW * scale);
        cropCanvas.height = Math.floor(targetH * scale);
        const ctx = cropCanvas.getContext("2d", { willReadFrequently: true });

        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
          videoFeed,
          targetX,
          targetY,
          targetW,
          targetH,
          0,
          0,
          cropCanvas.width,
          cropCanvas.height,
        );

        // Binarisering anpassad för ljusblå/grå bakgrund i produktionssystem
        const imgData = ctx.getImageData(
          0,
          0,
          cropCanvas.width,
          cropCanvas.height,
        );
        const data = imgData.data;

        let sumLum = 0;
        for (let i = 0; i < data.length; i += 4) {
          sumLum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        }
        const avgLum = sumLum / (data.length / 4);
        const threshold = avgLum * 0.76;

        for (let i = 0; i < data.length; i += 4) {
          const lum =
            0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          const pixelVal = lum < threshold ? 0 : 255; // Svart text på vit botten
          data[i] = pixelVal;
          data[i + 1] = pixelVal;
          data[i + 2] = pixelVal;
        }
        ctx.putImageData(imgData, 0, 0);

        return cropCanvas;
      }

      async function runCameraScanFrame() {
        if (!state.cameraActive || state.ocrBusy || !state.ocrWorker) return;
        if (Date.now() - state.lastCommittedTime < 1300) return; // Paus efter lyckad registrering

        const canvas = prepareCroppedFrame();
        if (!canvas) return;

        state.ocrBusy = true;
        try {
          const result = await state.ocrWorker.recognize(canvas);
          const cleanDigits = (result.data.text || "").replace(/[^0-9]/g, "");

          // Validering: Löpmeter på maskinen är minst 3 siffror och max 6 siffror
          if (cleanDigits.length >= 3 && cleanDigits.length <= 6) {
            const num = parseInt(cleanDigits, 10);
            handleOcrDetection(num);
          } else {
            setLiveNumberDisplay(null);
          }
        } catch (err) {
          console.warn("Scan frame error:", err);
        } finally {
          state.ocrBusy = false;
        }
      }

      function setLiveNumberDisplay(val) {
        state.currentDetectedVal = val;
        if (val !== null) {
          displayLiveReading.textContent = val.toLocaleString("sv-SE");
          displayLiveReading.className =
            "text-2xl font-bold font-mono-num text-zinc-900";
          displayLiveUnit.classList.remove("hidden");
          btnSaveCurrent.disabled = false;
          btnSaveLabel.textContent = `Spara till Kö ${state.targetQueue} (${val.toLocaleString("sv-SE")} m)`;
        } else {
          displayLiveReading.textContent = "------";
          displayLiveReading.className =
            "text-2xl font-bold font-mono-num text-zinc-300";
          displayLiveUnit.classList.add("hidden");
          btnSaveCurrent.disabled = true;
          btnSaveLabel.textContent = `Spara till Kö ${state.targetQueue}`;
        }
      }

      function handleOcrDetection(val) {
        setLiveNumberDisplay(val);

        if (!checkAutoSave.checked) return;

        // Om kön redan har detta värde registrerat, vänta på nästa
        const existing = state.queues.find(
          (q) => q.queueNo === state.targetQueue,
        );
        if (existing && existing.meters === val) return;

        // Kräver 2 stabila på varandra följande avläsningar
        if (state.lastStableVal === val) {
          state.stabilityCounter++;
        } else {
          state.lastStableVal = val;
          state.stabilityCounter = 1;
        }

        if (state.stabilityCounter >= 2) {
          saveQueueItem(state.targetQueue, val);
          state.stabilityCounter = 0;
          state.lastStableVal = null;
        }
      }

      function setTargetQueue(num) {
        state.targetQueue = Math.max(1, num);
        badgeTargetQueue.textContent = `Kö ${state.targetQueue}`;
        displayQueueStepper.textContent = state.targetQueue;
        btnSaveLabel.textContent =
          state.currentDetectedVal !== null
            ? `Spara till Kö ${state.targetQueue} (${state.currentDetectedVal.toLocaleString("sv-SE")} m)`
            : `Spara till Kö ${state.targetQueue}`;
      }

      function advanceToNextQueue() {
        const taken = state.queues.map((q) => q.queueNo);
        let next = state.targetQueue + 1;
        while (taken.includes(next)) {
          next++;
        }
        setTargetQueue(next);
      }

      function saveQueueItem(queueNo, meters) {
        state.lastCommittedTime = Date.now();

        // Uppdatera om kön redan finns, annars lägg till
        const existingIndex = state.queues.findIndex(
          (q) => q.queueNo === queueNo,
        );
        if (existingIndex !== -1) {
          state.queues[existingIndex].meters = meters;
        } else {
          state.queues.push({ queueNo, meters });
          state.queues.sort((a, b) => a.queueNo - b.queueNo);
        }

        triggerSuccessSignal();

        // Flash feedback
        flashTargetText.textContent = `Kö ${queueNo} Registrerad`;
        flashMetersText.textContent = `${meters.toLocaleString("sv-SE")} m`;
        saveFlash.classList.remove("opacity-0");
        saveFlash.classList.add("opacity-100");
        setTimeout(() => {
          saveFlash.classList.remove("opacity-100");
          saveFlash.classList.add("opacity-0");
        }, 500);

        advanceToNextQueue();
        renderQueueList();
      }

      async function startCamera() {
        try {
          initAudio();
          await initOcrWorker();

          const constraints = {
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
          };

          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          state.stream = stream;
          videoFeed.srcObject = stream;
          await videoFeed.play();

          state.cameraActive = true;
          videoFeed.classList.remove("hidden");
          viewfinderOverlay.classList.remove("hidden");
          camPlaceholder.classList.add("hidden");
          camStatusIndicator.className =
            "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
          ocrStatusBadge.textContent = "Söker siffror...";

          if (state.scanTimer) clearInterval(state.scanTimer);
          state.scanTimer = setInterval(runCameraScanFrame, 380);
        } catch (err) {
          console.error("Camera access error:", err);
          ocrStatusBadge.textContent = "Kamera nekad";
        }
      }

        text += "-------------------------\n";

        const q = parseInt(inputModalQueue.value, 10);
        const m = parseInt(inputModalMeters.value, 10);
        if (isNaN(q) || q <= 0 || isNaN(m) || m <= 0) return;

        if (state.editingIndex !== null) {
          state.queues[state.editingIndex].queueNo = q;
          state.queues[state.editingIndex].meters = m;
          state.queues.sort((a, b) => a.queueNo - b.queueNo);
        } else {
          const existIdx = state.queues.findIndex((item) => item.queueNo === q);
          if (existIdx !== -1) {
            state.queues[existIdx].meters = m;
          } else {
            state.queues.push({ queueNo: q, meters: m });
            state.queues.sort((a, b) => a.queueNo - b.queueNo);
          }
          advanceToNextQueue();
        }

        hideInputModal();
        renderQueueList();
      });

      window.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
        setTargetQueue(1);
        renderQueueList();
      });
    </script>
  </body>
</html>
